<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Pequeño Mundo</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        :root { font-family: monospace; color: #f5f0d0; background: #101820; }
        html, body { margin: 0; min-height: 100%; background: #101820; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .login-panel {
            width: min(360px, calc(100vw - 40px));
            padding: 28px;
            background: #1d3540;
            border: 4px solid #e8c96a;
            box-shadow: 8px 8px 0 #081016;
            text-align: center;
        }
        h1 { margin: 0 0 8px; color: #e8c96a; font-size: 25px; }
        .subtitle { margin: 0 0 22px; color: #8ed1c5; }
        label { display: block; margin: 12px 0 5px; text-align: left; color: #c8e5c0; }
        input, button { box-sizing: border-box; width: 100%; padding: 11px; font: inherit; }
        input { color: #f5f0d0; background: #10252c; border: 2px solid #5f8f87; }
        button { margin-top: 18px; color: #17262d; background: #e8c96a; border: 0; cursor: pointer; font-weight: bold; }
        button:hover { background: #fff0a8; }
        .switch { margin-top: 15px; color: #8ed1c5; cursor: pointer; }
        .message { min-height: 18px; margin-top: 14px; color: #f28b73; }
        #game-root { display: none; }
        canvas { image-rendering: pixelated; box-shadow: 0 0 0 4px #27444b, 10px 10px 0 #081016; }
        @media (max-width: 520px) { body { align-items: flex-start; padding-top: 20px; } canvas { max-width: 100vw; height: auto !important; } }
    </style>
</head>
<body>
<main id="login-panel" class="login-panel">
    <h1>MI PEQUEÑO MUNDO</h1>
    <p class="subtitle">Explora las islas gigantes</p>
    <form id="auth-form">
        <label for="username">Entrenador</label>
        <input id="username" maxlength="16" autocomplete="username" required>
        <label for="password">Contraseña</label>
        <input id="password" type="password" minlength="4" autocomplete="current-password" required>
        <button id="auth-button" type="submit">INICIAR SESION</button>
    </form>
    <div id="auth-switch" class="switch">¿Nuevo entrenador? Registrate</div>
    <div id="auth-message" class="message"></div>
</main>
<div id="game-root"></div>
<script>
// ---------- Registro e inicio de sesion local ----------
const authForm = document.getElementById('auth-form');
const authSwitch = document.getElementById('auth-switch');
const authButton = document.getElementById('auth-button');
const authMessage = document.getElementById('auth-message');
let registering = false;
let onlineSocket;

// Ajustes faciles de modificar: 500 bloques de 16 px forman una isla de 8000 px.
const TILE_SIZE = 16;
const WORLD_TILES = 500;
const WORLD_SIZE = TILE_SIZE * WORLD_TILES;
const ITEM_SCALE = 0.22;

function readUsers() {
    try { return JSON.parse(localStorage.getItem('zafiro-users') || '{}'); }
    catch (error) { return {}; }
}

authSwitch.addEventListener('click', () => {
    registering = !registering;
    authButton.textContent = registering ? 'REGISTRARME' : 'INICIAR SESION';
    authSwitch.textContent = registering ? '¿Ya tienes cuenta? Inicia sesion' : '¿Nuevo entrenador? Registrate';
    authMessage.textContent = '';
});

authForm.addEventListener('submit', (event) => {
    event.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const users = readUsers();
    if (registering) {
        if (users[username]) { authMessage.textContent = 'Ese entrenador ya existe.'; return; }
        users[username] = password;
        localStorage.setItem('zafiro-users', JSON.stringify(users));
    } else if (users[username] !== password) {
        authMessage.textContent = 'Entrenador o contraseña incorrectos.';
        return;
    }
    localStorage.setItem('zafiro-current-user', username);
    document.getElementById('login-panel').style.display = 'none';
    document.getElementById('game-root').style.display = 'block';
    startGame(username);
});

// ---------- Escena principal y mapa ----------
class PuebloScene extends Phaser.Scene {
    constructor() { super('PuebloScene'); }

    preload() {
        // Sprites propios en SVG: ligeros, transparentes y sin puntos de color.
        this.load.image('hero', 'assets/hero.svg');
        this.load.image('tree', 'assets/tree.svg');
        this.load.image('farm', 'assets/farm.svg');
        this.load.image('crops', 'assets/crops.svg');
        this.load.image('items', 'assets/items.svg');
        this.load.image('buildings', 'assets/buildings.svg');
        this.load.image('animals', 'assets/animals.svg');
        this.load.image('ore_copper', 'assets/ore_copper.svg');
        this.load.image('ore_iron', 'assets/ore_iron.svg');
        this.load.image('ore_gold', 'assets/ore_gold.svg');
        this.load.image('ore_gem', 'assets/ore_gem.svg');
        this.load.image('pickaxe', 'assets/pickaxe.svg');
        this.load.image('resource_log', 'assets/log.svg');
        this.load.image('resource_berry', 'assets/berry.svg');
        this.load.image('resource_potion', 'assets/potion.svg');
        this.load.image('resource_gem', 'assets/gem_blue.svg');
        this.load.image('resource_ore', 'assets/ore_rock.svg');
        this.load.image('resource_chest', 'assets/chest_common.svg');
        this.load.image('apple_tree_fruit', 'assets/apple_tree_fruit.svg');
        this.load.image('pine_tree', 'assets/pine_tree.svg');
        this.load.image('fence', 'assets/fence.svg');
        this.load.image('flower', 'assets/flower.svg');
        this.load.image('rock', 'assets/rock.svg');
        this.load.image('well', 'assets/well.svg');
        this.load.image('cottage', 'assets/cottage.svg');
        this.load.image('market_stall', 'assets/market_stall.svg');
        this.load.image('bridge_wood', 'assets/bridge_wood.svg');
        this.load.image('dock', 'assets/dock.svg');
        this.load.image('wheat', 'assets/wheat.svg');
        this.load.image('mushroom', 'assets/mushroom.svg');
    }

    create() {
        // Un mundo amplio, pero razonable para que funcione con fluidez en navegador.
        // Mundo compacto para que los jugadores se encuentren rápidamente.
        this.worldSize = WORLD_SIZE;
        this.physics.world.setBounds(0, 0, this.worldSize, this.worldSize);
        this.prepareItemSprites();
        this.prepareBuildingSprites();
        this.prepareAnimalSprites();
        this.drawWorld();
        this.spawnSceneryProps();
        this.createPlayer();
        this.createAnimals();
        this.createCollectibles();
        this.createOres();
        this.createHud();
        this.connectOnline();
        this.cameras.main.setBounds(0, 0, this.worldSize, this.worldSize);
        this.cameras.main.startFollow(this.player, true, 0.16, 0.16);
        this.cursors = this.input.keyboard.createCursorKeys();
        this.keys = this.input.keyboard.addKeys('W,S,D,SHIFT,Q,SPACE');
        this.input.keyboard.on('keydown-A', () => this.enterBuilding());
    }

    // Construye una sola isla grande con zonas de agua cruzables por puentes.
    drawWorld() {
        this.add.rectangle(this.worldSize / 2, this.worldSize / 2, this.worldSize, this.worldSize, 0x1e3d59);
        this.walls = this.physics.add.staticGroup();
        this.landmarks = [];

        // Isla principal con tierra, playa, caminos y zonas rurales.
        this.add.rectangle(4000, 4000, 7000, 7000, 0x4f9d64).setStrokeStyle(12, 0x9bd17b);
        this.add.rectangle(4000, 720, 7000, 260, 0xe0c27b);
        this.add.rectangle(4000, 7280, 7000, 260, 0xe0c27b);
        this.add.rectangle(720, 4000, 1200, 250, 0xe0c27b);
        this.add.rectangle(7320, 4000, 1200, 250, 0xe0c27b);
        this.add.rectangle(4000, 720, 250, 1200, 0xe0c27b);
        this.add.rectangle(4000, 7280, 250, 1200, 0xe0c27b);

        // Rio central con puente.
        this.addWater(4000, 1900, 180, 2400);
        this.addWater(4000, 6100, 180, 2200);
        this.add.rectangle(4000, 4000, 260, 120, 0x805533).setStrokeStyle(5, 0xd7a65a);
        this.add.text(4000, 4000, 'PUENTE', { fontFamily: 'monospace', fontSize: '12px', color: '#fff0a8' }).setOrigin(0.5);

        // Lagos, playa y fuente.
        this.addWater(1900, 1700, 620, 330);
        this.addWater(6000, 5800, 520, 280);
        this.add.circle(3000, 3800, 170, 0x238cb0).setStrokeStyle(5, 0x8dd8d3);
        this.add.circle(3000, 3800, 34, 0xd9c477).setStrokeStyle(4, 0x8b6b3f);
        this.add.text(3000, 3800, 'FUENTE', { fontFamily: 'monospace', fontSize: '11px', color: '#fff0a8' }).setOrigin(0.5);
        this.add.rectangle(1200, 3000, 900, 240, 0xe0c27b);
        this.add.rectangle(6800, 5000, 900, 240, 0xe0c27b);
        this.add.rectangle(3000, 4000, 900, 700, 0xc19a62);
        this.add.rectangle(3000, 4000, 5400, 110, 0xc19a62);
        this.add.rectangle(3000, 4000, 110, 5400, 0xc19a62);

        // Edificios importantes.
        this.createCabin(2250, 3300, 'house', 'HOSPITAL');
        this.createCabin(3150, 5000, 'market', 'GYM');
        this.createCabin(5500, 3300, 'barn', 'REFUGIO');
        this.createCabin(5800, 5000, 'house', 'CABAÑA');
        this.createCabin(2700, 6200, 'market', 'AGRICULTOR');
        this.createCabin(6100, 6200, 'house', 'CASA');

        // Lugares importantes del mapa.
        this.addImportantLandmark(1200, 3400, 'HOSPITAL', 0x6bb7ff);
        this.addImportantLandmark(3400, 5000, 'GYM', 0xffd166);
        this.addImportantLandmark(5600, 3300, 'REFUGIO', 0x8ee6b5);
        this.addImportantLandmark(2700, 6200, 'CAMPOS', 0xe3c86d);
        this.addImportantLandmark(6500, 5200, 'TRABAJO', 0xe3c86d);
        this.addImportantLandmark(1900, 6400, 'PLAYA', 0xffd68a);
        this.addImportantLandmark(6500, 7600, 'MUELLE', 0xd9b57a);
        this.addImportantLandmark(6500, 1800, 'CUEVA', 0x7c8ca5);

        // Señales de huertas, granjas y cuevas.
        this.decorateIsland(2300, 5200);
        this.decorateIsland(5600, 4300);
        this.decorateIsland(6400, 6200);
        [[1400, 5900], [6700, 1800], [6900, 6500]].forEach(([x, y]) => {
            this.add.circle(x, y, 90, 0x37404a).setStrokeStyle(10, 0x69727a);
            this.add.ellipse(x, y + 25, 90, 120, 0x121b25);
            this.add.text(x, y + 125, 'CUEVA', { fontFamily: 'monospace', fontSize: '11px', color: '#fff0a8' }).setOrigin(0.5);
        });
        [[1500, 700], [6500, 7300]].forEach(([x, y]) => {
            this.add.rectangle(x, y, 90, 420, 0x805533).setStrokeStyle(4, 0xd7a65a);
            for (let offset = -160; offset <= 160; offset += 80) this.add.rectangle(x, y + offset, 105, 14, 0xd7a65a);
            this.add.text(x, y + 235, 'MUELLE', { fontFamily: 'monospace', fontSize: '11px', color: '#fff0a8' }).setOrigin(0.5);
        });

        // Playa con arena y borde de costa.
        this.add.rectangle(1000, 7600, 1400, 900, 0xf0d9a8).setStrokeStyle(4, 0x9a7d5d);
        this.add.rectangle(7000, 7600, 1400, 900, 0xf0d9a8).setStrokeStyle(4, 0x9a7d5d);

        this.add.text(4000, 420, 'MI PEQUEÑO MUNDO', { fontFamily: 'monospace', fontSize: '30px', color: '#fff0a8' }).setOrigin(0.5);
        this.addWall(500, 500, 7000, 30); this.addWall(7500, 4000, 30, 7000);
        this.addWall(4000, 7500, 7000, 30); this.addWall(500, 4000, 30, 7000);
    }

    spawnSceneryProps() {
        const propGroups = [
            { key: 'apple_tree_fruit', x: 1600, y: 1200, scale: 1.2 },
            { key: 'apple_tree_fruit', x: 2100, y: 1400, scale: 1.1 },
            { key: 'apple_tree_fruit', x: 2400, y: 1200, scale: 1.2 },
            { key: 'pine_tree', x: 2300, y: 5600, scale: 1.15 },
            { key: 'pine_tree', x: 2800, y: 6100, scale: 1.15 },
            { key: 'pine_tree', x: 6300, y: 4400, scale: 1.2 },
            { key: 'pine_tree', x: 5700, y: 6700, scale: 1.2 },
            { key: 'fence', x: 2400, y: 5200, scale: 0.9 },
            { key: 'fence', x: 6500, y: 6800, scale: 0.9 },
            { key: 'flower', x: 1200, y: 2000, scale: 0.75 },
            { key: 'flower', x: 3900, y: 5200, scale: 0.75 },
            { key: 'flower', x: 6100, y: 3300, scale: 0.75 },
            { key: 'rock', x: 830, y: 3300, scale: 0.9 },
            { key: 'rock', x: 5400, y: 2500, scale: 0.9 },
            { key: 'rock', x: 6800, y: 6400, scale: 0.9 },
            { key: 'well', x: 3500, y: 4400, scale: 1.1 },
            { key: 'well', x: 5400, y: 5600, scale: 1.1 },
            { key: 'cottage', x: 2600, y: 5100, scale: 1.1 },
            { key: 'cottage', x: 7000, y: 5100, scale: 1.1 },
            { key: 'market_stall', x: 3300, y: 6400, scale: 1.1 },
            { key: 'dock', x: 6900, y: 7400, scale: 1.3 },
            { key: 'bridge_wood', x: 4000, y: 4000, scale: 1.1 },
            { key: 'wheat', x: 3800, y: 6000, scale: 0.8 },
            { key: 'wheat', x: 6400, y: 6200, scale: 0.8 },
            { key: 'mushroom', x: 1700, y: 6400, scale: 0.7 },
            { key: 'mushroom', x: 6800, y: 1850, scale: 0.7 }
        ];

        propGroups.forEach(({ key, x, y, scale }) => {
            this.add.image(x, y, key).setScale(scale).setDepth(3);
        });

        const randomProps = ['apple_tree_fruit', 'pine_tree', 'flower', 'rock', 'mushroom', 'wheat'];
        for (let index = 0; index < 46; index += 1) {
            const key = randomProps[index % randomProps.length];
            const x = Phaser.Math.Between(700, this.worldSize - 700);
            const y = Phaser.Math.Between(700, this.worldSize - 700);
            const sprite = this.add.image(x, y, key).setScale(Phaser.Math.FloatBetween(0.45, 1.2)).setDepth(2);
            if (key === 'flower') sprite.setScale(0.7);
            if (key === 'rock') sprite.setScale(0.8);
        }
    }

    addWater(x, y, width, height) {
        this.add.rectangle(x, y, width, height, 0x238cb0).setStrokeStyle(5, 0x8dd8d3);
        this.addWall(x, y, width, height);
    }

    addWall(x, y, width, height) {
        this.walls.add(this.add.rectangle(x, y, width, height, 0x355c50).setAlpha(0.01));
    }

    prepareSpriteSheet() {
        const source = this.textures.get('spritesheet').getSourceImage();
        const canvasTexture = this.textures.createCanvas('pixel-assets', source.width, source.height);
        const context = canvasTexture.context;
        context.drawImage(source, 0, 0);
        const pixels = context.getImageData(0, 0, source.width, source.height);
        for (let index = 0; index < pixels.data.length; index += 4) {
            if (pixels.data[index] > 238 && pixels.data[index + 1] > 238 && pixels.data[index + 2] > 238) pixels.data[index + 3] = 0;
        }
        context.putImageData(pixels, 0, 0);
        canvasTexture.refresh();
        // Primer personaje de la columna CHARACTER del collage.
        // El primer personaje ocupa aproximadamente x=24..86, y=48..112.
        canvasTexture.add('player', 0, 24, 48, 64, 64);
    }

    prepareItemSprites() {
        const source = this.textures.get('items').getSourceImage();
        const texture = this.textures.createCanvas('item-assets', source.width, source.height);
        texture.context.drawImage(source, 0, 0);
        texture.refresh();
        texture.add('gema', 0, 0, 0, 64, 64);
        texture.add('semilla', 0, 64, 0, 64, 64);
        texture.add('moneda', 0, 128, 0, 64, 64);
    }

    prepareBuildingSprites() {
        const source = this.textures.get('buildings').getSourceImage();
        const texture = this.textures.createCanvas('building-assets', source.width, source.height);
        texture.context.drawImage(source, 0, 0);
        texture.refresh();
        texture.add('house', 0, 0, 0, 128, 96);
        texture.add('market', 0, 128, 0, 128, 96);
        texture.add('barn', 0, 256, 0, 128, 96);
    }

    prepareAnimalSprites() {
        const source = this.textures.get('animals').getSourceImage();
        const texture = this.textures.createCanvas('animal-assets', source.width, source.height);
        texture.context.drawImage(source, 0, 0);
        texture.refresh();
        texture.add('cow', 0, 0, 0, 64, 64);
        texture.add('sheep', 0, 64, 0, 64, 64);
    }

    addImportantLandmark(x, y, label, color) {
        const marker = this.add.rectangle(x, y, 42, 42, color, 0.9).setStrokeStyle(3, 0xffffff);
        this.add.text(x, y + 34, label, { fontFamily: 'monospace', fontSize: '8px', color: '#fff0a8' }).setOrigin(0.5);
        this.landmarks.push({ x, y, marker, label });
    }

    createCabin(x, y, type = 'house', label = 'CASA') {
        const baseColor = label === 'HOSPITAL' ? 0xc9ebff : (label === 'GYM' ? 0xffe7a3 : (label === 'REFUGIO' ? 0xc8f3d7 : 0xe9e2c0));
        const roofColor = label === 'HOSPITAL' ? 0x4e86c9 : (label === 'GYM' ? 0xda8d2d : (label === 'REFUGIO' ? 0x5ea35a : 0xd95858));

        this.add.rectangle(x, y, 180, 110, baseColor).setStrokeStyle(3, 0x473b46);
        this.add.rectangle(x, y - 58, 195, 24, roofColor).setStrokeStyle(2, 0x473b46);
        this.add.text(x, y - 58, label, { fontFamily: 'monospace', fontSize: '13px', color: '#fff4cf' }).setOrigin(0.5);
        this.add.rectangle(x, y + 30, 25, 50, 0x6d4b51);
        this.add.text(x, y + 30, label === 'HOSPITAL' ? 'H' : (label === 'GYM' ? 'G' : (label === 'REFUGIO' ? 'R' : 'P')), { fontFamily: 'monospace', fontSize: '18px', color: '#fff4cf' }).setOrigin(0.5);
        const building = this.add.image(x, y, 'building-assets', type).setDepth(2).setScale(1.25);
        this.buildings = this.buildings || [];
        const name = label === 'HOSPITAL' ? 'Hospital' : (label === 'GYM' ? 'Gimnasio' : (label === 'REFUGIO' ? 'Refugio' : (label === 'AGRICULTOR' ? 'Agricultor' : (label === 'MERCADO' ? 'Mercado' : 'Casa'))));
        this.buildings.push({ x, y, name });
        this.doors = this.doors || [];
        this.doors.push({ x, y: y + 68, name });
        this.addWall(x - 95, y, 12, 110); this.addWall(x + 95, y, 12, 110); this.addWall(x, y - 65, 200, 12);
    }

    createAnimals() {
        this.animals = [];
        for (let index = 0; index < 18; index += 1) {
            const x = 500 + ((index * 173) % 6800);
            const y = 500 + ((index * 251) % 6800);
            const type = index % 2 === 0 ? 'cow' : 'sheep';
            const animal = this.add.image(x, y, 'animal-assets', type).setScale(0.65).setDepth(3);
            this.animals.push(animal);
            this.tweens.add({ targets: animal, x: x + Phaser.Math.Between(-35, 35), y: y + Phaser.Math.Between(-35, 35), duration: 2600, yoyo: true, repeat: -1, delay: index * 110 });
        }
    }

    createOres() {
        this.ores = [];
        const oreDefs = [
            { x: 1200, y: 2200, key: 'ore_copper', label: 'Cobre' },
            { x: 1600, y: 2600, key: 'ore_iron', label: 'Hierro' },
            { x: 2300, y: 1900, key: 'ore_gold', label: 'Oro' },
            { x: 6200, y: 2200, key: 'ore_gem', label: 'Gema' },
            { x: 6800, y: 2800, key: 'ore_iron', label: 'Hierro' },
            { x: 7200, y: 5200, key: 'ore_gold', label: 'Oro' }
        ];
        oreDefs.forEach((oreDef) => {
            const ore = this.add.image(oreDef.x, oreDef.y, oreDef.key).setScale(0.8).setDepth(3);
            ore.oreType = oreDef.label;
            ore.itemLabel = this.add.text(oreDef.x, oreDef.y - 26, oreDef.label, { fontFamily: 'monospace', fontSize: '9px', color: '#fff0a8' }).setOrigin(0.5);
            this.ores.push(ore);
        });
        this.pickaxe = this.add.image(0, 0, 'pickaxe').setScale(0.8).setVisible(false).setDepth(10);
    }

    // Objetos simples del mundo que el jugador puede recoger al acercarse.
    createCollectibles() {
        this.inventory = 0;
        this.collectibles = [];
        const objects = [
            [720, 650, 'gema', 'resource_gem', 'GEMA'],
            [580, 720, 'semilla', 'resource_potion', 'POCION'],
            [850, 760, 'moneda', 'resource_chest', 'TESORO'],
            [1150, 450, 'gema', 'resource_gem', 'GEMA'],
            [1500, 700, 'semilla', 'resource_log', 'MADERA'],
            [2800, 3200, 'madera', 'resource_log', 'MADERA'],
            [2200, 4800, 'fruta', 'resource_berry', 'FRUTA'],
            [5400, 5400, 'gema', 'resource_gem', 'GEMA'],
            [6500, 4600, 'piedra', 'resource_ore', 'PIEDRA'],
            [3500, 6600, 'pocion', 'resource_potion', 'POCION']
        ];
        objects.forEach(([x, y, type, key, label]) => {
            const item = this.add.image(x, y, key).setScale(0.9).setDepth(4);
            item.itemType = type;
            item.itemLabel = this.add.text(x, y - 22, label, { fontFamily: 'monospace', fontSize: '9px', color: '#fff0a8' }).setOrigin(0.5);
            this.collectibles.push(item);
        });

        const scatteredResources = [
            { key: 'resource_log', type: 'madera', label: 'MADERA' },
            { key: 'resource_berry', type: 'fruta', label: 'FRUTA' },
            { key: 'resource_ore', type: 'piedra', label: 'PIEDRA' },
            { key: 'resource_potion', type: 'pocion', label: 'POCION' },
            { key: 'resource_gem', type: 'gema', label: 'GEMA' },
            { key: 'resource_chest', type: 'tesoro', label: 'TESORO' }
        ];
        for (let index = 0; index < 28; index += 1) {
            const choice = scatteredResources[index % scatteredResources.length];
            const x = Phaser.Math.Between(600, this.worldSize - 600);
            const y = Phaser.Math.Between(600, this.worldSize - 600);
            const item = this.add.image(x, y, choice.key).setScale(0.7).setDepth(4);
            item.itemType = choice.type;
            item.itemLabel = this.add.text(x, y - 18, choice.label, { fontFamily: 'monospace', fontSize: '9px', color: '#fff0a8' }).setOrigin(0.5);
            this.collectibles.push(item);
        }
        this.pickupHint = this.add.text(650, 580, 'ESPACIO: RECOGER', { fontFamily: 'monospace', fontSize: '12px', color: '#10252c', backgroundColor: '#f1c75b', padding: { x: 7, y: 5 } }).setOrigin(0.5).setAlpha(0);
        this.input.keyboard.on('keydown-SPACE', () => this.pickupNearby());
        this.input.keyboard.on('keydown-Q', () => this.toggleInventory());
        this.input.keyboard.on('keydown-E', () => this.pickupNearby());
    }

    pickupNearby() {
        const item = this.collectibles.find((candidate) => candidate.active && Phaser.Math.Distance.Between(this.player.x, this.player.y, candidate.x, candidate.y) < 42);
        if (item) {
            item.itemLabel.destroy();
            item.destroy();
            this.inventory += 1;
            this.inventoryItems[item.itemType] = (this.inventoryItems[item.itemType] || 0) + 1;
            this.inventoryText.setText(`OBJETOS: ${this.inventory}`);
            this.inventoryPanelText.setText(this.inventorySummary());
            return;
        }

        const ore = this.ores.find((candidate) => candidate.active && Phaser.Math.Distance.Between(this.player.x, this.player.y, candidate.x, candidate.y) < 60);
        if (!ore) return;
        ore.itemLabel.destroy();
        ore.destroy();
        const oreKey = ore.oreType.toLowerCase().replace(/\s+/g, '_');
        this.inventoryItems[oreKey] = (this.inventoryItems[oreKey] || 0) + 1;
        this.inventory += 1;
        this.inventoryText.setText(`OBJETOS: ${this.inventory}`);
        this.inventoryPanelText.setText(this.inventorySummary());
    }

    enterBuilding() {
        const door = this.doors.find((candidate) => Phaser.Math.Distance.Between(this.player.x, this.player.y, candidate.x, candidate.y) < 70);
        if (!door) return;
        if (onlineSocket) onlineSocket.disconnect();
        this.scene.start('InteriorScene', { buildingName: door.name, returnX: this.player.x, returnY: this.player.y + 35 });
    }

    inventorySummary() {
        return `INVENTARIO\n\nGEMAS: ${this.inventoryItems.gema || 0}\nMADERA: ${this.inventoryItems.madera || 0}\nFRUTA: ${this.inventoryItems.fruta || 0}\nPIEDRA: ${this.inventoryItems.piedra || 0}\nPOCION: ${this.inventoryItems.pocion || 0}\nTESORO: ${this.inventoryItems.tesoro || 0}\nSEMILLAS: ${this.inventoryItems.semilla || 0}\nMONEDAS: ${this.inventoryItems.moneda || 0}\nCOPPER: ${this.inventoryItems.cobre || 0}\nHIERRO: ${this.inventoryItems.hierro || 0}\nORO: ${this.inventoryItems.oro || 0}\n\nPulsa Q para cerrar`;
    }

    toggleInventory() {
        this.inventoryPanel.setVisible(!this.inventoryPanel.visible);
        this.inventoryPanelText.setVisible(this.inventoryPanel.visible);
    }

    // Detalles visuales inspirados en los mapas rurales de las referencias.
    decorateIsland(x, y) {
        [[-300, -300], [330, -300], [-300, 300], [350, 300], [230, -280]].forEach(([offsetX, offsetY]) => {
            this.add.rectangle(x + offsetX, y + offsetY + 30, 14, 34, 0x684632);
            this.add.circle(x + offsetX, y + offsetY, 34, 0x236b45).setStrokeStyle(3, 0x164c38);
            this.add.circle(x + offsetX - 16, y + offsetY + 8, 21, 0x328451);
            this.add.image(x + offsetX, y + offsetY - 8, 'tree').setScale(0.72).setDepth(2);
        });
        // Huerto de manzanas: copas verdes con frutos rojos.
        this.add.text(x - 300, y - 365, 'HUERTO', { fontFamily: 'monospace', fontSize: '10px', color: '#fff0a8' }).setOrigin(0.5);
        [-340, -300, -260].forEach((offsetX) => {
            this.add.rectangle(x + offsetX, y - 330, 8, 35, 0x684632);
            this.add.circle(x + offsetX, y - 360, 26, 0x3d8948);
            this.add.circle(x + offsetX - 10, y - 355, 4, 0xd94b43);
            this.add.circle(x + offsetX + 10, y - 366, 4, 0xd94b43);
        });
        // Cerezos con racimos rosas junto al camino.
        this.add.text(x + 330, y + 365, 'CEREZAS', { fontFamily: 'monospace', fontSize: '10px', color: '#fff0a8' }).setOrigin(0.5);
        [-35, 35].forEach((offsetX) => {
            this.add.rectangle(x + 300 + offsetX, y + 330, 8, 34, 0x684632);
            this.add.circle(x + 300 + offsetX, y + 300, 24, 0x438d4c);
            this.add.circle(x + 290 + offsetX, y + 305, 4, 0xc93655);
            this.add.circle(x + 310 + offsetX, y + 294, 4, 0xc93655);
        });
        // Dos cultivos distintos: trigo dorado y maiz alto.
        this.add.text(x - 170, y + 340, 'TRIGO', { fontFamily: 'monospace', fontSize: '10px', color: '#fff0a8' }).setOrigin(0.5);
        for (let row = 0; row < 3; row += 1) {
            for (let column = 0; column < 6; column += 1) {
                const cropX = x - 245 + column * 30;
                const cropY = y + 370 + row * 22;
                this.add.rectangle(cropX, cropY, 4, 16, 0xd9b443);
                this.add.circle(cropX, cropY - 8, 5, 0xf0cf54);
            }
        }
        this.add.text(x + 95, y + 340, 'MAIZ', { fontFamily: 'monospace', fontSize: '10px', color: '#fff0a8' }).setOrigin(0.5);
        for (let row = 0; row < 3; row += 1) {
            for (let column = 0; column < 5; column += 1) {
                const cropX = x + 40 + column * 28;
                const cropY = y + 370 + row * 22;
                this.add.rectangle(cropX, cropY, 5, 18, 0x3f873e);
                this.add.rectangle(cropX + 5, cropY - 6, 8, 5, 0xe6c83b);
            }
        }
        for (let index = 0; index < 12; index += 1) {
            const flowerX = x - 250 + ((index * 97) % 500);
            const flowerY = y - 245 + ((index * 61) % 490);
            this.add.circle(flowerX, flowerY, 3, index % 2 ? 0xf5d66c : 0xe5796d);
        }
        this.add.rectangle(x - 170, y + 250, 150, 90, 0x70462d).setStrokeStyle(3, 0x4d3426);
        this.add.image(x - 170, y + 250, 'crops').setScale(0.82).setDepth(2);
        for (let row = 0; row < 3; row += 1) {
            for (let column = 0; column < 5; column += 1) {
                this.add.circle(x - 220 + column * 25, y + 220 + row * 25, 6, 0x72b83e);
            }
        }
        this.add.rectangle(x - 40, y + 260, 8, 55, 0x7f542e);
        this.add.triangle(x - 40, y + 235, -35, 0, 35, 0, 0, 28, 0xd56b42);
    }

    // El personaje usa fisica Arcade: bordes, agua y paredes bloquean el movimiento.
    createPlayer() {
        this.playerMarker = this.add.circle(650, 650, 18, 0xffd34e).setStrokeStyle(3, 0x5e392b);
        this.player = this.add.image(650, 650, 'hero').setScale(0.62).setDepth(5);
        this.physics.add.existing(this.player);
        this.player.body.setCollideWorldBounds(true);
        this.player.body.setSize(18, 25).setOffset(7, 20);
        this.player.body.setMaxVelocity(320, 320);
        this.physics.add.collider(this.player, this.walls);
        this.playerLabel = this.add.text(650, 615, window.currentUser, { fontFamily: 'monospace', fontSize: '12px', color: '#fff0a8', backgroundColor: '#10252c' }).setOrigin(0.5);
    }

    // Socket.io comparte la posicion con todos los jugadores conectados.
    connectOnline() {
        this.remotePlayers = {};
        // GitHub Pages no ejecuta el servidor Socket.io; en ese caso el juego
        // sigue siendo jugable en modo local sin jugadores remotos.
        if (typeof io !== 'function') return;
        onlineSocket = io();
        onlineSocket.on('currentPlayers', (players) => {
            Object.values(players).forEach((player) => {
                if (player.id !== onlineSocket.id) this.addRemotePlayer(player);
            });
        });
        onlineSocket.on('newPlayer', (player) => this.addRemotePlayer(player));
        onlineSocket.on('playerUpdated', (player) => this.updateRemotePlayer(player));
        onlineSocket.on('playerMoved', (player) => this.updateRemotePlayer(player));
        onlineSocket.on('playerDisconnected', (id) => {
            if (this.remotePlayers[id]) {
                this.remotePlayers[id].marker.destroy();
                this.remotePlayers[id].nameLabel.destroy();
                this.remotePlayers[id].destroy();
                delete this.remotePlayers[id];
            }
        });
        onlineSocket.emit('playerJoin', { name: window.currentUser });
        this.lastNetworkUpdate = 0;
    }

    addRemotePlayer(player) {
        if (!onlineSocket || player.id === onlineSocket.id) return;
        if (!this.remotePlayers[player.id]) {
            const marker = this.add.circle(player.x, player.y, 18, 0x63d6cb).setStrokeStyle(3, 0x174b4a);
            const remote = this.add.image(player.x, player.y, 'hero').setScale(0.62).setTint(0x9be1dc).setDepth(5);
            remote.nameLabel = this.add.text(player.x, player.y - 35, player.name || 'Explorador', { fontFamily: 'monospace', fontSize: '11px', color: '#ffffff', backgroundColor: '#10252c' }).setOrigin(0.5);
            remote.marker = marker;
            this.remotePlayers[player.id] = remote;
        }
        this.updateRemotePlayer(player);
    }

    updateRemotePlayer(player) {
        const remote = this.remotePlayers[player.id];
        if (!remote) { this.addRemotePlayer(player); return; }
        remote.setPosition(player.x, player.y);
        remote.marker.setPosition(player.x, player.y);
        remote.nameLabel.setPosition(player.x, player.y - 35).setText(player.name || 'Explorador');
    }

    createHud() {
        const panel = this.add.rectangle(240, 294, 480, 36, 0x152b34, 0.94).setScrollFactor(0);
        this.add.text(14, 286, `EXPLORADOR: ${window.currentUser}`, { fontFamily: 'monospace', fontSize: '12px', color: '#f5f0d0' }).setScrollFactor(0);
        this.add.text(14, 303, 'FLECHAS / WASD / SHIFT  |  ONLINE', { fontFamily: 'monospace', fontSize: '10px', color: '#8ed1c5' }).setScrollFactor(0);
        this.inventoryText = this.add.text(350, 303, 'OBJETOS: 0', { fontFamily: 'monospace', fontSize: '10px', color: '#f1c75b' }).setScrollFactor(0);
        this.inventoryItems = {};
        this.inventoryPanel = this.add.rectangle(240, 160, 250, 210, 0x152b34, 0.98).setStrokeStyle(4, 0xe8c96a).setScrollFactor(0).setDepth(20).setVisible(false);
        this.inventoryPanelText = this.add.text(145, 70, this.inventorySummary(), { fontFamily: 'monospace', fontSize: '16px', color: '#f5f0d0', lineSpacing: 8 }).setScrollFactor(0).setDepth(21).setVisible(false);

        this.minimapBg = this.add.rectangle(430, 55, 130, 130, 0x0c1c1f, 0.9).setStrokeStyle(3, 0xe8c96a).setScrollFactor(0).setDepth(25);
        this.minimap = this.add.graphics().setScrollFactor(0).setDepth(26);
        this.minimapWidth = 120;
        this.minimapHeight = 120;
        this.minimapScale = this.minimapWidth / this.worldSize;
        this.updateMinimap();
    }

    updateMinimap() {
        if (!this.minimap) return;
        this.minimap.clear();

        // Mundo base
        this.minimap.fillStyle(0x1e3d59, 1);
        this.minimap.fillRect(430 - this.minimapWidth / 2, 55 - this.minimapHeight / 2, this.minimapWidth, this.minimapHeight);

        // Isla principal
        this.minimap.fillStyle(0x4f9d64, 1);
        const islandX = 430 - this.minimapWidth / 2 + (4000 * this.minimapScale);
        const islandY = 55 - this.minimapHeight / 2 + (4000 * this.minimapScale);
        const islandSize = 7000 * this.minimapScale;
        this.minimap.fillRect(islandX - islandSize / 2, islandY - islandSize / 2, islandSize, islandSize);

        // Sitios importantes
        this.landmarks.forEach((landmark) => {
            const px = 430 - this.minimapWidth / 2 + (landmark.x * this.minimapScale);
            const py = 55 - this.minimapHeight / 2 + (landmark.y * this.minimapScale);
            this.minimap.fillStyle(landmark.marker.fillColor || 0x4bb7ff, 1);
            this.minimap.fillRect(px - 2, py - 2, 4, 4);
        });

        // Jugador.
        const playerX = 430 - this.minimapWidth / 2 + (this.player.x * this.minimapScale);
        const playerY = 55 - this.minimapHeight / 2 + (this.player.y * this.minimapScale);
        this.minimap.fillStyle(0xffd166, 1);
        this.minimap.fillRect(playerX - 3, playerY - 3, 6, 6);

        // Frontera.
        this.minimap.lineStyle(2, 0xe8c96a, 1);
        this.minimap.strokeRect(430 - this.minimapWidth / 2, 55 - this.minimapHeight / 2, this.minimapWidth, this.minimapHeight);
    }

    update() {
        const left = this.cursors.left.isDown;
        const right = this.cursors.right.isDown || this.keys.D.isDown;
        const up = this.cursors.up.isDown || this.keys.W.isDown;
        const down = this.cursors.down.isDown || this.keys.S.isDown;
        const speed = this.keys.SHIFT.isDown ? 320 : 220;
        this.player.body.setVelocity(
            ((right ? 1 : 0) - (left ? 1 : 0)) * speed,
            ((down ? 1 : 0) - (up ? 1 : 0)) * speed
        );
        if (this.player.body.velocity.x && this.player.body.velocity.y) this.player.body.velocity.scale(0.7);
        this.playerMarker.setPosition(this.player.x, this.player.y);
        this.playerLabel.setPosition(this.player.x, this.player.y - 35);
        const nearbyItem = this.collectibles.some((item) => item.active && Phaser.Math.Distance.Between(this.player.x, this.player.y, item.x, item.y) < 42);
        const nearbyOre = this.ores.some((ore) => ore.active && Phaser.Math.Distance.Between(this.player.x, this.player.y, ore.x, ore.y) < 60);
        this.pickupHint.setPosition(this.player.x, this.player.y - 55).setAlpha(nearbyItem || nearbyOre ? 1 : 0);
        this.updateMinimap();
        if (onlineSocket && onlineSocket.connected && this.time.now > this.lastNetworkUpdate + 50) {
            onlineSocket.emit('playerMovement', { x: this.player.x, y: this.player.y });
            this.lastNetworkUpdate = this.time.now;
        }
    }
}

// Interior comun para casa, mercado y granero. Se sale acercandose a la puerta y pulsando A.
class InteriorScene extends Phaser.Scene {
    constructor() { super('InteriorScene'); }

    create(data) {
        this.returnData = data;
        this.add.rectangle(400, 300, 800, 600, 0x4b3029);
        this.add.rectangle(400, 315, 650, 430, 0xd8c58f).setStrokeStyle(8, 0x7b4b36);
        for (let x = 80; x < 720; x += 40) for (let y = 105; y < 525; y += 40) this.add.rectangle(x, y, 36, 36, (x + y) % 80 === 0 ? 0xf0dfa8 : 0xcdb87f);
        this.add.text(400, 75, data.buildingName.toUpperCase(), { fontFamily: 'monospace', fontSize: '22px', color: '#fff0a8' }).setOrigin(0.5);
        this.add.rectangle(400, 530, 74, 22, 0xb74a42);
        this.add.text(400, 505, 'A: SALIR', { fontFamily: 'monospace', fontSize: '12px', color: '#ffffff' }).setOrigin(0.5);
        this.player = this.physics.add.sprite(400, 450, 'hero').setScale(0.62);
        this.player.setCollideWorldBounds(true);
        this.cursors = this.input.keyboard.createCursorKeys();
        this.keys = this.input.keyboard.addKeys('W,S,D');
        this.keyA = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A);
    }

    update() {
        this.player.setVelocity(0);
        if (this.cursors.left.isDown) this.player.setVelocityX(-220);
        else if (this.cursors.right.isDown || this.keys.D.isDown) this.player.setVelocityX(220);
        if (this.cursors.up.isDown || this.keys.W.isDown) this.player.setVelocityY(-220);
        else if (this.cursors.down.isDown || this.keys.S.isDown) this.player.setVelocityY(220);
        if (Phaser.Input.Keyboard.JustDown(this.keyA) && this.player.y > 490) this.scene.start('PuebloScene', { spawnX: this.returnData.returnX, spawnY: this.returnData.returnY });
    }
}

// ---------- Arranque del juego Phaser ----------
function startGame(username) {
    window.currentUser = username;
    new Phaser.Game({
        type: Phaser.AUTO,
        parent: 'game-root',
        width: 480,
        height: 320,
        pixelArt: true,
        backgroundColor: '#5aa66a',
        physics: { default: 'arcade', arcade: { debug: false } },
        scene: [PuebloScene, InteriorScene]
    });
}
